spring.application.name=micorservicios-respuestas
server.port=${PORT:0}
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Eureka (estaba comentado — descomentado)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.data.mongodb.uri=mongodb://localhost:27017/db_microservicios_respuestas

# Actuator — observabilidad
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=ms-respuestas
info.app.description=Microservicio de respuestas con historial de intentos
info.app.version=2.0.0

<div class="card text-bg-light mb-3" >
  <div class="card-header"> {{titulo}} </div>
  <div class="card-body">
    
        <button class="btn btn-secondary my-2" routerLink="/alumnos"> VOLVER </button>

        <form>
          <div class="form-group">
              <label for="nombre"> NOMBRE </label>
              <input type="text" id="nombre" name="nombre" class="form-control" 
              [(ngModel)]="model.nombre">
              <div class="alert alert-danger" *ngIf="error?.nombre">
                {{ error.nombre}}
              </div>
          </div>

          <div class="form-group">
              <label for="apellido"> APELLIDO </label>
              <input type="text" id="apellido" name="apellido" class="form-control"
              [(ngModel)]="model.apellido">
              <div class="alert alert-danger" *ngIf="error?.apellido">
                {{ error.apellido}}
              </div>
          </div>

          <div class="form-group">
              <label for="email"> EMAIL </label>
              <input type="text" id="email" name="email" class="form-control"
              [(ngModel)]="model.email">
              <div class="alert alert-danger" *ngIf="error?.email">
                {{ error.email}}
              </div>
          </div>

          <div class="form-group">
              <div class="input-group mb-3">
                <label class="input-group-text" for="inputGroupFile01">Seleccionar foto</label>
                <input (change)="seleccionarFoto($event)" type="file" class="form-control" id="inputGroupFile01">
              </div>
          </div>


          <div class="form-group">
              <button type="button"  class="btn btn-primary" 
              (click)="model.id? editar(): crear()">
              {{model.id? 'EDITAR': 'CREAR'}} </button>
          </div>

        </form>
  </div>
</div>

<div class="card text-bg-light mb-3" >
  <div class="card-header"> {{titulo}} </div>
  <div class="card-body">
    
        <button class="btn btn-primary my-2" routerLink="/cursos/form"> CREAR </button>

        <div class="alert alert-info" *ngIf="lista?.length==0">
            No hay cursos en el sistema
        </div>

            <table class="table table-hover table-striped" *ngIf="lista?.length>0">
            <thead>
                <tr>
                    <th> ID </th>
                    <th> NOMBRE</th> 
                    <th> ALUMNOS</th>
                    <th> EXAMENES </th>
                    <th> CREADO EN </th>
                    <th> EDITAR  </th>
                    <th> ELIMINAR  </th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let curso of lista">
                    <td> {{curso.id}} </td>
                    <!-- <td> {{alumno.nombre | uppercase}} </td> -->
                    <td> {{curso.nombre }} </td>
                    <th>
                        <button class="btn btn-info btn-sm"
                        [routerLink]="['/cursos/asignar-alumnos', curso.id]">
                        AÑADIR {{curso.alumnos.length}}
                        </button>
                    </th>

                    <th>
                        <button class="btn btn-info btn-sm"
                            [routerLink]="['/cursos/asignar-examenes', curso.id]"
                        > 
                            AÑADIR ({{curso.examenes.length}})
                        </button>
                    </th>

                    <td> {{curso.createAt | date:'yyyy/MM/dd'}} </td>
                    <td> <button class="btn btn-secondary btn-sm" 
                        [routerLink]="['/cursos/form', curso.id]"> EDITAR </button> 
                    </td>
                    <td><button class="btn btn-danger btn-sm" 
                        (click)="eliminar(curso)"> Eliminar</button> 
                    </td>
                </tr>
            </tbody>
        </table>

        <mat-paginator [length]="totalRegistros"
              [pageSize]="totalPorPagina"
              [pageIndex]="paginaActual"
              [pageSizeOptions]="pageSizeOptions"
              aria-label="Select page" 
              (page)="paginar($event)"
              showFirstLastButtons
              class="float-left mx-2">
        </mat-paginator>

  </div>
</div>

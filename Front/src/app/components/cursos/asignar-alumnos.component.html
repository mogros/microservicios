<mat-card>
  <mat-card-header *ngIf="curso">
    <mat-card-title>
        ALUMNOS DEL CURSO {{curso.nombre}}
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>

  <mat-tab-group dynamicHeight  [(selectedIndex)]="tabIndex">
    <mat-tab label="ASIGNAR ALUMNOS">  

            <mat-form-field class="mx-3" style="width: 50%;">
                <input matInput placeholder="Buscar Alumnos" (keyup)="filtrar($event.target.value)">
            </mat-form-field>

            <table mat-table [dataSource]="alumnosAsignar" class="mat-elevation-z8 mx-3"
            style="width: 75%;">

                
              <ng-container matColumnDef="seleccion">
                <th mat-header-cell *matHeaderCellDef>  
                    <mat-checkbox 
                        (change)="$event? seleccionarDesseleccionarTodos(): null"
                        [checked]="seleccion.hasValue() && estanTodosSeleccionados()"
                        [indeterminate]="seleccion.hasValue() && !estanTodosSeleccionados()">

                    </mat-checkbox>
                </th>
                <td mat-cell *matCellDef="let alumno">  
                    <mat-checkbox
                        (click)="$event.stopPropagation()"
                        (change)="$event? seleccion.toggle(alumno): null"
                        [checked]="seleccion.isSelected(alumno)"
                    >
                        
                    </mat-checkbox>
                </td>
              </ng-container>


              <ng-container matColumnDef="nombre">
                <th mat-header-cell *matHeaderCellDef> NOMBRE </th>
                <td mat-cell *matCellDef="let alumno"> {{alumno.nombre}} </td>
              </ng-container>

              <ng-container matColumnDef="apellido">
                <th mat-header-cell *matHeaderCellDef> APELLIDO </th>
                <td mat-cell *matCellDef="let alumno"> {{alumno.apellido}} </td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="mostrarColumnas"></tr>
              <tr mat-row *matRowDef="let alumno; columns: mostrarColumnas;" 
                (click)="seleccion.toggle(alumno)"></tr>
            </table>

            <button mat-raised-button color="primary" class="m-4" (click)="asignar()"
              [disabled]="!seleccion.hasValue()"> ASIGNAR </button>
      </mat-tab>

      <mat-tab label="ALUMNOS">  
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 m-3"
            style="width: 75%;">

              <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef> ID </th>
                <td mat-cell *matCellDef="let alumno"> {{alumno.id}} </td>
              </ng-container>

              <ng-container matColumnDef="nombre">
                <th mat-header-cell *matHeaderCellDef> NOMBRE </th>
                <td mat-cell *matCellDef="let alumno"> {{alumno.nombre}} </td>
              </ng-container>

              <ng-container matColumnDef="apellido">
                <th mat-header-cell *matHeaderCellDef> APELLIDO </th>
                <td mat-cell *matCellDef="let alumno"> {{alumno.apellido}} </td>
              </ng-container>

              <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef> EMAIL </th>
                <td mat-cell *matCellDef="let alumno"> {{alumno.email}} </td>
              </ng-container>

             <ng-container matColumnDef="eliminar">
              <th mat-header-cell *matHeaderCellDef> Eliminar </th>
              <td mat-cell *matCellDef="let alumno">
                <button mat-mini-fab style="background-color: #f44336; color: white;" 
                (click)="eliminarAlumno(alumno)"> X </button>
              </td>
            </ng-container>



              <tr mat-header-row *matHeaderRowDef="mostrarColumnasAlumnos"></tr>
              <tr mat-row *matRowDef="let row; columns: mostrarColumnasAlumnos;" 
                ></tr>
                
            </table>

            <mat-paginator 
                  [pageSizeOptions]="pageSizeOptions"
                  showFirstLastButtons
                  class="float-left mx-2">
            </mat-paginator>


      </mat-tab>
    </mat-tab-group>

  </mat-card-content>
  
</mat-card>

<div class="card text-bg-light mb-3" >
  <div class="card-header"> {{titulo}} </div>
  <div class="card-body">
    
        <button class="btn btn-primary my-2" routerLink="/examenes/form"> CREAR </button>

        <div class="alert alert-info" *ngIf="lista?.length==0">
            No hay examenes en el sistema
        </div>

            <table class="table table-hover table-striped" *ngIf="lista?.length>0">
            <thead>
                <tr>
                    <th> ID </th>
                    <th> NOMBRE</th> 
                    <th> ASIGNATURAS </th>
                    <th> PREGUNTAS </th>
                    <th> CREADO EN </th>
                    <th> EDITAR  </th>
                    <th> ELIMINAR  </th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let examen of lista">
                    <td> {{examen.id}} </td>
                    <!-- <td> {{alumno.nombre | uppercase}} </td> -->
                    <td> {{examen.nombre }} </td>
                    <td> {{examen.asignaturaPadre.nombre }}  -> {{examen.asignaturaHija.nombre}}</td>
                    <td> {{examen.preguntas.length}} </td>
                    <td> {{examen.createAt | date:'yyyy/MM/dd'}} </td>
                    <td> <button class="btn btn-secondary btn-sm" 
                        [routerLink]="['/examenes/form', examen.id]"> EDITAR </button> 
                    </td>
                    <td><button class="btn btn-danger btn-sm" 
                        (click)="eliminar(examen)"> Eliminar</button> 
                    </td>
                </tr>
            </tbody>
        </table>

        <mat-paginator [length]="totalRegistros"
              [pageSize]="totalPorPagina"
              [pageIndex]="paginaActual"
              [pageSizeOptions]="pageSizeOptions"
              aria-label="Select page" 
              (page)="paginar($event)"
              showFirstLastButtons
              class="float-left mx-2">
        </mat-paginator>

  </div>
</div>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/cursos">APP CURSOS</a>

    <button class="navbar-toggler" type="button" (click)="isCollapsed = !isCollapsed">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [ngbCollapse]="isCollapsed">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0" *ngIf="isLoggedIn">
        <li class="nav-item">
          <a class="nav-link" routerLink="/alumnos" routerLinkActive="active">Alumnos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/cursos" routerLinkActive="active">Cursos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/examenes" routerLinkActive="active">Exámenes</a>
        </li>
        <!-- Reportes solo para admin y docente -->
        <li class="nav-item" *ngIf="isDocente">
          <a class="nav-link" routerLink="/reportes" routerLinkActive="active">
            📊 Reportes
          </a>
        </li>
      </ul>

      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <ng-container *ngIf="isLoggedIn; else loginLink">
          <li class="nav-item d-flex align-items-center me-3">
            <span class="navbar-text text-white-50 me-2">{{ username }}</span>
            <span *ngIf="isAdmin"   class="badge bg-warning text-dark me-1">Admin</span>
            <span *ngIf="isDocente && !isAdmin" class="badge bg-info text-dark me-1">Docente</span>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-light btn-sm" (click)="logout()">
              Cerrar sesión
            </button>
          </li>
        </ng-container>
        <ng-template #loginLink>
          <li class="nav-item">
            <a class="nav-link" routerLink="/login">Iniciar sesión</a>
          </li>
        </ng-template>
      </ul>
    </div>
  </div>
</nav>
